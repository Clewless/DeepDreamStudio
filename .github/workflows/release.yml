name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Upload verified release assets
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload release assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload verified distributions to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
