name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: Install dev tools and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: ruff check
        run: ruff check app tests scripts
      - name: ruff format
        run: ruff format --check app tests scripts
      - name: mypy
        run: mypy app tests scripts

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Tk (Linux/macOS)
        # Tkinter is an OS package, not a pip one, and the GUI tests need it.
        # macOS runners ship a python.org build with Tk; Homebrew's does not.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install runtime and dev dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Cache Torch Hub models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: torch-hub-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            torch-hub-${{ runner.os }}-
            torch-hub-
      # The engine tests download real torchvision weights on first use; the
      # runner's cache makes that a one-off per job.
      - name: Warm the torch weight cache
        run: |
          python -c "import torchvision.models as m; m.googlenet(weights='IMAGENET1K_V1')"
      - name: pytest (CPU, no display)
        env:
          # GUI tests build a real Tk window; Xvfb gives them a display.
          DISPLAY: ":99"
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y xvfb libxkbcommon-x11-0
            xvfb-run -a python -m pytest -q
          else
            python -m pytest -q
          fi

  package:
    name: Build wheel
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
